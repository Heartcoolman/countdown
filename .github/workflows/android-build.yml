name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 下载 Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
      
    - name: 授予 Gradle 执行权限
      run: chmod +x gradlew
      
    - name: 设置 Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper
          
    - name: 构建 Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: 上传 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: composeApp/build/outputs/apk/debug/*.apk
        retention-days: 30
        
    - name: 构建 Release APK (未签名)
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: true  # 如果没有配置签名可能会失败
      
    - name: 上传 Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-release-unsigned
        path: composeApp/build/outputs/apk/release/*.apk
        retention-days: 30


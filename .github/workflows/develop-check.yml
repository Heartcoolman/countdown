name: Develop Branch Check

on:
  push:
    branches: [ develop ]  # 只在 develop 分支触发
  pull_request:
    branches: [ develop ]  # PR 到 develop 分支时触发
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 下载 Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
      
    - name: 授予 Gradle 执行权限
      run: chmod +x gradlew
      
    - name: 设置 Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: wrapper
          
    - name: 编译检查（不打包）
      run: ./gradlew compileDebugKotlinAndroid --stacktrace
      
    - name: 运行测试（如果有）
      run: ./gradlew testDebugUnitTest --stacktrace
      continue-on-error: true
      
    - name: 检查结果
      run: echo "✅ 代码检查通过，develop 分支可以继续开发"

